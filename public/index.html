<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ずんだもんコンパニオン</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app">

      <!-- ===== 左パネル: キャラクターエリア ===== -->
      <div class="left-panel" id="left-panel">

        <!-- 部屋装飾 (窓 + 時計) -->
        <div class="room-deco">
          <div class="window">
            <div class="window-sky" id="window-sky"></div>
            <div class="window-cross"></div>
          </div>
          <div class="room-clock" id="clock">12:00</div>
        </div>

        <!-- パーティクル (complete 時) -->
        <div class="particles" id="particles">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <!-- キャラクター + 吹き出し -->
        <div class="character-area" id="character-area">
          <div class="bubble" id="bubble">
            <span id="bubble-text">待機中なのだ</span>
          </div>
          <div class="character" id="character">
            <img src="/zundamon.png" id="zundamon-img" alt="ずんだもん" />
          </div>
        </div>

        <!-- 机 -->
        <div class="desk">
          <div class="desk-top"></div>
          <div class="desk-drawers">
            <div class="desk-drawer"></div>
            <div class="desk-drawer"></div>
          </div>
        </div>
      </div>

      <!-- ===== 右パネル: ダッシュボード ===== -->
      <div class="right-panel">

        <!-- ステータス + 接続 -->
        <div class="dash-section status-section" id="status-section">
          <div class="status-badge" id="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">待機中</span>
          </div>
          <div class="connection-indicator">
            <span class="conn-dot" id="conn-dot"></span>
            <span id="conn-text">接続中...</span>
          </div>
        </div>

        <!-- 使用量 -->
        <div class="dash-section usage-section" id="usage-widget">
          <div class="section-label">◆ 5h 使用量</div>
          <div class="usage-main-row">
            <span class="usage-tokens" id="usage-tokens">読込中...</span>
            <span class="usage-reset" id="usage-reset"></span>
          </div>
          <div class="usage-bar-wrap" id="usage-bar-wrap">
            <div class="usage-bar" id="usage-bar" style="width: 0%"></div>
          </div>
          <div class="usage-weekly" id="usage-weekly"></div>
        </div>

        <!-- セッション履歴 -->
        <div class="dash-section history-section">
          <div class="section-label">📋 直近の作業</div>
          <div class="history-list" id="history-list">
            <div class="history-empty">まだ作業がありません</div>
          </div>
        </div>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
