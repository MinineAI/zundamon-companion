<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ずんだもんコンパニオン</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app">

      <!-- ===== 左パネル: キャラクターエリア ===== -->
      <div class="left-panel" id="left-panel">

        <!-- 時計 -->
        <div class="room-deco">
          <div class="room-clock" id="clock">12:00</div>
        </div>

        <!-- パーティクル (complete 時) -->
        <div class="particles" id="particles">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <!-- キャラクター + 吹き出し -->
        <div class="character-area" id="character-area">
          <div class="bubble" id="bubble">
            <span id="bubble-text">待機中なのだ</span>
          </div>
          <div class="character" id="character">
            <img src="/zundamon.png" id="zundamon-img" alt="ずんだもん" />
          </div>
        </div>

      </div>

      <!-- ===== 右パネル: ダッシュボード ===== -->
      <div class="right-panel">

        <!-- 使用量（コンパクト1行） -->
        <div class="usage-compact" id="usage-widget">
          <span class="usage-compact-label">◆</span>
          <span class="usage-compact-tokens" id="usage-tokens">--</span>
          <div class="usage-compact-bar-wrap" id="usage-bar-wrap">
            <div class="usage-bar" id="usage-bar" style="width: 0%"></div>
          </div>
          <span class="usage-compact-pct" id="usage-pct"></span>
          <span class="usage-compact-reset" id="usage-reset"></span>
          <span class="conn-dot" id="conn-dot"></span>
        </div>

        <!-- セッション一覧 -->
        <div class="session-list" id="session-list"></div>

        <!-- 直近の作業（選択セッションのみ） -->
        <div class="dash-section history-section">
          <div class="section-label">直近の作業</div>
          <div class="history-list" id="history-list">
            <div class="history-empty">まだ作業がありません</div>
          </div>
        </div>

      </div>

      <!-- 権限リクエスト ボトムシート（危険操作のみ表示） -->
      <div id="perm-sheet" class="perm-sheet" aria-hidden="true">
        <div class="perm-drag-bar"></div>
        <div class="perm-header">
          <span class="perm-title">🔔 権限リクエスト</span>
          <span class="perm-timer" id="perm-timer">60s</span>
        </div>
        <div class="perm-meta">
          <span class="perm-tool" id="perm-tool"></span>
          <span class="perm-badge">🔴 危険操作</span>
        </div>
        <pre class="perm-preview" id="perm-preview"></pre>
        <div class="perm-actions">
          <button class="perm-btn perm-always" id="perm-always">Always allow for project (local) <kbd>Ctrl+↵</kbd></button>
          <div class="perm-actions-row2">
            <button class="perm-btn perm-allow" id="perm-allow">一度だけ許可 <kbd>↵</kbd></button>
            <button class="perm-btn perm-deny" id="perm-deny">拒否 <kbd>Esc</kbd></button>
          </div>
        </div>
      </div>

    </div>

    <script src="app.js"></script>
  </body>
</html>
